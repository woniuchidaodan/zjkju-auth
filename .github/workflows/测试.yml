name: 🚀 测试（ipk + apk）

on:
  workflow_dispatch:
    inputs:
      channel:
        description: '发布通道（beta=预发布，stable=正式版）'
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable

permissions: write-all

env:
  # SDK 解压到工作区内：不需要 sudo，也才能被 actions/cache 缓存
  SDK_DIR: ${{ github.workspace }}/sdk
  SDK_TAR: ${{ github.workspace }}/sdk.tar.zst

jobs:
  build:
    name: 构建 ${{ matrix.pkg_format }} (${{ matrix.sdk_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg_format: ipk
            sdk_version: 24.10.6
            sdk_url: https://downloads.immortalwrt.org/releases/24.10.6/targets/mediatek/filogic/immortalwrt-sdk-24.10.6-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst
          - pkg_format: apk
            sdk_version: 25.12.2
            sdk_url: https://mirrors.jlu.edu.cn/immortalwrt/releases/25.12.2/targets/mediatek/filogic/immortalwrt-sdk-25.12.2-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
    outputs:
      pkg_version: ${{ steps.extract-version.outputs.pkg_version }}

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      # ==================================================================
      # 缓存 SDK（解压后的整个目录，含 feeds 与 dl 下载缓存）
      #
      # 首次运行：下载 SDK → 解压 → feeds update/install → 保存缓存
      # 后续运行：直接还原缓存，跳过下载和解压（省 3~5 分钟）
      #
      # key 里带 -v1，改动解压流程或需要强制重建时改成 -v2 即可
      # ==================================================================
      - name: 恢复 SDK 缓存
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.SDK_DIR }}
          key: sdk-${{ matrix.sdk_version }}-${{ matrix.pkg_format }}-v1
          restore-keys: |
            sdk-${{ matrix.sdk_version }}-${{ matrix.pkg_format }}-

      - name: 下载并解压 SDK（缓存未命中时）
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y zstd
          echo "下载 SDK: ${{ matrix.sdk_url }}"
          wget --show-progress "${{ matrix.sdk_url }}" -O "$SDK_TAR"
          mkdir -p "$SDK_DIR"
          tar --use-compress-program=unzstd -xf "$SDK_TAR" -C "$SDK_DIR" --strip-components=1
          rm -f "$SDK_TAR"
          echo "=== SDK 目录 ==="
          ls -la "$SDK_DIR" | head

      - name: 复制软件包到 SDK
        run: |
          set -e
          mkdir -p "$SDK_DIR/package/luci-app-zjkju-auth"
          cp "$GITHUB_WORKSPACE/Makefile" "$SDK_DIR/package/luci-app-zjkju-auth/"
          cp -r "$GITHUB_WORKSPACE/luasrc" "$SDK_DIR/package/luci-app-zjkju-auth/"
          cp -r "$GITHUB_WORKSPACE/root" "$SDK_DIR/package/luci-app-zjkju-auth/"
          # JS 视图（如果仓库里有 htdocs 就一并带上）
          if [ -d "$GITHUB_WORKSPACE/htdocs" ]; then
            cp -r "$GITHUB_WORKSPACE/htdocs" "$SDK_DIR/package/luci-app-zjkju-auth/"
          fi
          echo "=== 软件包文件树 ==="
          find "$SDK_DIR/package/luci-app-zjkju-auth" -type f | sort

      - name: 更新并安装 feeds（缓存未命中时）
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          set -e
          cd "$SDK_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 配置编译选项（IPK）
        if: matrix.pkg_format == 'ipk'
        run: |
          set -e
          cd "$SDK_DIR"
          rm -f .config
          echo "CONFIG_PACKAGE_luci-app-zjkju-auth=m" >> .config
          echo "CONFIG_PACKAGE_luci-compat=y" >> .config
          echo "CONFIG_PACKAGE_luci-base=y" >> .config
          echo "CONFIG_PACKAGE_curl=y" >> .config
          echo "# CONFIG_USE_APK is not set" >> .config
          make defconfig

      - name: 配置编译选项（APK）
        if: matrix.pkg_format == 'apk'
        run: |
          set -e
          cd "$SDK_DIR"
          rm -f .config
          echo "CONFIG_PACKAGE_luci-app-zjkju-auth=m" >> .config
          echo "CONFIG_PACKAGE_luci-compat=y" >> .config
          echo "CONFIG_PACKAGE_luci-base=y" >> .config
          echo "CONFIG_PACKAGE_curl=y" >> .config
          echo "CONFIG_USE_APK=y" >> .config
          make defconfig

      - name: 开始编译
        run: |
          set -o pipefail          # 关键：不加这个，make 失败会被 tee 掩盖成成功
          cd "$SDK_DIR"
          make package/luci-app-zjkju-auth/compile V=s -j$(nproc) 2>&1 | tee /tmp/build.log

      - name: 收集生成的 ${{ matrix.pkg_format }} 包
        if: success()
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/output"
          if [ "${{ matrix.pkg_format }}" = "ipk" ]; then
            find "$SDK_DIR/bin/packages" -name "luci-app-zjkju-auth*.ipk" -exec cp -v {} "$GITHUB_WORKSPACE/output/" \;
          else
            find "$SDK_DIR/bin/packages" -name "luci-app-zjkju-auth*.apk" -exec cp -v {} "$GITHUB_WORKSPACE/output/" \;
          fi
          echo "=== 编译产物 ==="
          ls -la "$GITHUB_WORKSPACE/output/"
          COUNT=$(ls -1 "$GITHUB_WORKSPACE/output/" 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::编译没有产出任何 ${{ matrix.pkg_format }} 包，请检查上面的编译日志"
            exit 1
          fi
          echo "共收集到 $COUNT 个文件"

      - name: 提取版本号
        id: extract-version
        run: |
          PKG_VERSION=$(grep '^PKG_VERSION:=' Makefile | cut -d= -f2 | tr -d ' ')
          PKG_RELEASE=$(grep '^PKG_RELEASE:=' Makefile | cut -d= -f2 | tr -d ' ')
          echo "pkg_version=${PKG_VERSION}-r${PKG_RELEASE}" >> $GITHUB_OUTPUT
          echo "✅ 版本: ${PKG_VERSION}-r${PKG_RELEASE}"

      - name: 上传编译产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.pkg_format }}
          path: ${{ github.workspace }}/output/*
          retention-days: 30
          if-no-files-found: error

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.pkg_format }}
          path: /tmp/build.log
          retention-days: 7

  release:
    name: 📦 发布
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出源码（用于读取发布说明）
        uses: actions/checkout@v4

      - name: 下载所有编译产物
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: ${{ github.workspace }}/output
          merge-multiple: true

      - name: 列出所有文件
        run: |
          echo "=== 全部产物 ==="
          find ${{ github.workspace }}/output -type f | sort
          echo ""
          echo "=== 文件总数 ==="
          find ${{ github.workspace }}/output -type f | wc -l

      - name: 提取版本号
        id: extract-version
        run: |
          echo "pkg_version=${{ needs.build.outputs.pkg_version }}" >> $GITHUB_OUTPUT

      - name: 🚀 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          CHANNEL="${{ inputs.channel }}"
          VERSION="${{ needs.build.outputs.pkg_version }}"

          if [ "$CHANNEL" = "stable" ]; then
            TAG="v${VERSION}"
            TITLE="luci-app-zjkju-auth ${VERSION}"
            PRE_FLAG=""
          else
            TAG="v${VERSION}-beta"
            TITLE="luci-app-zjkju-auth ${VERSION} Beta"
            PRE_FLAG="--prerelease"
          fi

          echo "==== 发布通道: $CHANNEL ===="
          echo "==== TAG: $TAG ===="

          echo "==== 删除旧 Release (如果存在) ===="
          gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag 2>/dev/null || echo "旧 Release 不存在"

          NOTES_FILE="${GITHUB_WORKSPACE}/.github/RELEASE_NOTES.md"

          # ---- 先确认真的有安装包，避免创建出"空壳 release" ----
          shopt -s nullglob
          PKGS=("${GITHUB_WORKSPACE}"/output/*.ipk "${GITHUB_WORKSPACE}"/output/*.apk)
          shopt -u nullglob
          if [ ${#PKGS[@]} -eq 0 ]; then
            echo "::error::output 目录里没有任何 ipk/apk，取消发布"
            exit 1
          fi
          echo "本次将上传 ${#PKGS[@]} 个安装包："
          printf '  %s\n' "${PKGS[@]}"

          echo "==== 创建新 Release: $TAG ===="
          if [ -f "$NOTES_FILE" ]; then
            echo "使用 RELEASE_NOTES.md 作为发布说明"
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "$TITLE" \
              $PRE_FLAG \
              --notes-file "$NOTES_FILE"
          else
            echo "未找到 RELEASE_NOTES.md，改为自动生成变更列表"
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "$TITLE" \
              $PRE_FLAG \
              --generate-notes
          fi

          echo "==== 上传所有包 ===="
          # 注意：不要用 *.ipk *.apk 这种裸 glob —— 没匹配到时 shell 会把字面量传进去，
          # gh 会报 "no matches found" 导致整个上传失败，而 release 已经建好了却没有任何附件。
          gh release upload "$TAG" "${PKGS[@]}" --repo "$REPO" --clobber

          echo "==== 验证附件 ===="
          gh release view "$TAG" --repo "$REPO"

          ASSET_COUNT=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets | length')
          echo "附件数量: $ASSET_COUNT"
          if [ "$ASSET_COUNT" -eq 0 ]; then
            echo "::error::Release $TAG 创建成功但没有任何附件，请检查构建产物"
            exit 1
          fi

          echo "✅ 发布完成"
          echo "Release: https://github.com/$REPO/releases/tag/$TAG"
