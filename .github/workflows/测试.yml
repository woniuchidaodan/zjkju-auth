name: 🚀 测试（ipk + apk）

on:
  workflow_dispatch:
    inputs:
      channel:
        description: '发布通道（beta=预发布，stable=正式版）'
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable

permissions: write-all

jobs:
  build:
    name: 构建 ${{ matrix.pkg_format }} (${{ matrix.sdk_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg_format: ipk
            sdk_version: 24.10.6
            sdk_url: https://downloads.immortalwrt.org/releases/24.10.6/targets/mediatek/filogic/immortalwrt-sdk-24.10.6-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst
          - pkg_format: apk
            sdk_version: 25.12.2
            sdk_url: https://mirrors.jlu.edu.cn/immortalwrt/releases/25.12.2/targets/mediatek/filogic/immortalwrt-sdk-25.12.2-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
    outputs:
      pkg_version: ${{ steps.extract-version.outputs.pkg_version }}

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 下载 ImmortalWrt SDK (${{ matrix.sdk_version }})
        run: |
          SDK_URL="${{ matrix.sdk_url }}"
          echo "下载地址: $SDK_URL"
          wget --show-progress "$SDK_URL" -O /tmp/sdk.tar.zst
          sudo apt-get update -qq
          sudo apt-get install -y zstd
          sudo mkdir -p /opt/sdk
          sudo tar --use-compress-program=unzstd -xf /tmp/sdk.tar.zst -C /opt/sdk --strip-components=1
          sudo chown -R $(id -u):$(id -g) /opt/sdk
          echo "=== SDK 目录预览 ==="
          ls -la /opt/sdk | head

      - name: 复制软件包到 SDK
        run: |
          mkdir -p /opt/sdk/package/luci-app-zjkju-auth
          cp $GITHUB_WORKSPACE/Makefile /opt/sdk/package/luci-app-zjkju-auth/
          cp -r $GITHUB_WORKSPACE/luasrc /opt/sdk/package/luci-app-zjkju-auth/
          cp -r $GITHUB_WORKSPACE/root /opt/sdk/package/luci-app-zjkju-auth/
          echo "=== 软件包文件树 ==="
          find /opt/sdk/package/luci-app-zjkju-auth -type f | head -30

      - name: 更新并安装 feeds
        run: |
          cd /opt/sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 配置格式（${{ matrix.pkg_format }}）
        run: |
          cd /opt/sdk
          make defconfig
          if [ "${{ matrix.pkg_format }}" = "apk" ]; then
            echo "CONFIG_USE_APK=y" >> .config
          else
            echo "# CONFIG_USE_APK is not set" >> .config
          fi
          make defconfig

      - name: 开始编译
        run: |
          cd /opt/sdk
          # 直接调用 compile，SDK 会自动解决依赖，不再需要手动写入 =m
          make package/luci-app-zjkju-auth/compile V=s -j$(nproc) 2>&1 | tee /tmp/build.log

      - name: 收集生成的 ${{ matrix.pkg_format }} 包
        if: success()
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          if [ "${{ matrix.pkg_format }}" = "ipk" ]; then
            find /opt/sdk/bin/packages -name "luci-app-zjkju-auth*.ipk" -exec cp -v {} $GITHUB_WORKSPACE/output/ \;
            COUNT=$(find $GITHUB_WORKSPACE/output -name "*.ipk" | wc -l)
          else
            find /opt/sdk/bin/packages -name "luci-app-zjkju-auth*.apk" -exec cp -v {} $GITHUB_WORKSPACE/output/ \;
            COUNT=$(find $GITHUB_WORKSPACE/output -name "*.apk" | wc -l)
          fi
          echo "=== 编译产物 ==="
          ls -la $GITHUB_WORKSPACE/output/
          
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::编译完成但未找到任何 ${{ matrix.pkg_format }} 文件！请检查日志。"
            exit 1
          fi

      - name: 提取版本号
        id: extract-version
        run: |
          PKG_VERSION=$(grep '^PKG_VERSION:=' Makefile | cut -d= -f2 | tr -d ' ')
          PKG_RELEASE=$(grep '^PKG_RELEASE:=' Makefile | cut -d= -f2 | tr -d ' ')
          echo "pkg_version=${PKG_VERSION}-r${PKG_RELEASE}" >> $GITHUB_OUTPUT
          echo "✅ 版本: ${PKG_VERSION}-r${PKG_RELEASE}"

      - name: 上传编译产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.pkg_format }}
          path: ${{ github.workspace }}/output/*
          retention-days: 30
          if-no-files-found: error

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.pkg_format }}
          path: /tmp/build.log
          retention-days: 7

  release:
    name: 📦 发布
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 下载所有编译产物
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: ${{ github.workspace }}/output
          merge-multiple: true

      - name: 列出所有文件
        run: |
          echo "=== 全部产物 ==="
          find ${{ github.workspace }}/output -type f | sort
          echo ""
          echo "=== 文件总数 ==="
          find ${{ github.workspace }}/output -type f | wc -l

      - name: 提取版本号
        id: extract-version
        run: |
          echo "pkg_version=${{ needs.build.outputs.pkg_version }}" >> $GITHUB_OUTPUT

      - name: 🚀 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          CHANNEL="${{ inputs.channel }}"
          VERSION="${{ needs.build.outputs.pkg_version }}"

          if [ "$CHANNEL" = "stable" ]; then
            TAG="v${VERSION}"
            TITLE="luci-app-zjkju-auth ${VERSION}"
            PRE_FLAG=""
          else
            TAG="v${VERSION}-beta"
            TITLE="luci-app-zjkju-auth ${VERSION} Beta"
            PRE_FLAG="--prerelease"
          fi

          echo "==== 发布通道: $CHANNEL ===="
          echo "==== TAG: $TAG ===="

          echo "==== 删除旧 Release (如果存在) ===="
          gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag 2>/dev/null || echo "旧 Release 不存在"

          # 安全提取所有包，防止 *.ipk 为空时导致 gh 报错
          shopt -s nullglob
          PKGS=("${GITHUB_WORKSPACE}"/output/*.ipk "${GITHUB_WORKSPACE}"/output/*.apk)
          shopt -u nullglob
          if [ ${#PKGS[@]} -eq 0 ]; then
            echo "::error::output 目录里没有任何 ipk/apk，取消发布"
            exit 1
          fi

          echo "==== 创建新 Release: $TAG ===="
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$TITLE" \
            $PRE_FLAG \
            --notes "## luci-app-zjkju-auth ${VERSION}

          湛江科技学院锐捷 ePortal 校园网自动认证的 LuCI 应用。

          ### 🚀 核心更新
          - **修复版本号识别（opkg `1.0.4-7` → `1.0.4-r7`），解决装完仍无限提示更新的问题**
          - **修复升级后账号、密码被清空的问题**
          - **修复日志偶发消失的问题（全场景强制落盘）**
          - **优化在线更新：直连优先 + 真实下载进度显示**
          - **恢复 1.0.2 同款的配置保存读秒遮罩，且彻底解决点两次生效的 Bug**

          ### 📦 安装说明
          **方式一：opkg（旧系统）**
          \`\`\`bash
          opkg install /tmp/luci-app-zjkju-auth_*.ipk
          \`\`\`
          **方式二：apk（新系统）**
          \`\`\`bash
          apk add --allow-untrusted /tmp/luci-app-zjkju-auth_*.apk
          \`\`\`"

          echo "==== 上传所有包 ===="
          gh release upload "$TAG" "${PKGS[@]}" --repo "$REPO" --clobber

          echo "✅ 发布完成"
          echo "Release: https://github.com/$REPO/releases/tag/$TAG"
